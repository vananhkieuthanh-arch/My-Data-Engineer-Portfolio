version: 2

models:
  - name: fct_weather_daily
    columns:
      - name: country_code
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: location_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: year_month_key
        tests:
          - not_null
    tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - country_code
                - observation_date